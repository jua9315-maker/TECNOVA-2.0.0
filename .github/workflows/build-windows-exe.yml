
name: Generar Instalador Windows (.exe)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Etiqueta opcional para publicar en GitHub Releases'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-windows-exe:
    name: Compilar TECNOVA (.exe)
    runs-on: windows-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verificar archivos del proyecto
        shell: pwsh
        run: |
          Write-Host "Verificando package.json..."
          if (!(Test-Path "package.json")) {
            throw "No se encontró package.json"
          }
          Write-Host "Archivos del proyecto encontrados."

      - name: Instalar dependencias
        run: npm install --include=dev

      - name: Compilar aplicación y generar EXE
        run: npm run electron:build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verificar ejecutables generados
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "release") {
            Write-Host "Contenido de release:"
            Get-ChildItem release -Recurse
          } else {
            Write-Host "No se generó release. Revisar los errores del paso de compilación."
          }

      - name: Subir ejecutables
        uses: actions/upload-artifact@v4
        with:
          name: TECNOVA-Windows-EXE
          path: release/*.exe
          if-no-files-found: error

      - name: Publicar GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          name: TECNOVA ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
